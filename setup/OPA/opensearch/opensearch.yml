cluster.name: demo-hanabank
node.name: node-1
node.roles: ["data", "data_hot", "ingest", "cluster_manager", "remote_cluster_client"]
path.data: /data/opensearch
path.logs: /logs/opensearch
network.host: 0.0.0.0
http.port: 9200
discovery.type: single-node

plugins.security.disabled: false
plugins.security.ssl.transport.pemcert_filepath: /conf/opensearch/certs/site.crt
plugins.security.ssl.transport.pemkey_filepath: /conf/opensearch/certs/site.key
plugins.security.ssl.transport.pemtrustedcas_filepath: /conf/opensearch/certs/ca.crt
plugins.security.ssl.transport.enforce_hostname_verification: false
plugins.security.ssl.http.enabled: true
plugins.security.ssl.http.pemcert_filepath: /conf/opensearch/certs/site.crt
plugins.security.ssl.http.pemkey_filepath: /conf/opensearch/certs/site.key
plugins.security.ssl.http.pemtrustedcas_filepath: /conf/opensearch/certs/ca.crt
plugins.security.allow_default_init_securityindex: false
plugins.security.authcz.admin_dn:
  - "CN=sentinel,O=cruxsiem,L=Seoul,ST=Seoul,C=KR"
plugins.security.nodes_dn:
  - "CN=sentinel,O=cruxsiem,L=Seoul,ST=Seoul,C=KR"
plugins.security.audit.type: internal_opensearch
